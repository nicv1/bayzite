---
name: Build Bayzite ISOs

# Turns the published images into bootable installer ISOs.
# Runs automatically after "Build Bayzite images" succeeds from a push or a
# manual run (not after the daily rebuilds), and can be started by hand.
# Download the finished ISOs from the run's "Artifacts" section.
on:
  workflow_run:
    workflows: ["Build Bayzite images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      edition:
        description: "Which ISO to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - bayzite-gnome
          - bayzite-gnome-nvidia
          - bayzite-kde
          - bayzite-kde-nvidia

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Pick editions
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'schedule')
    outputs:
      editions: ${{ steps.pick.outputs.editions }}
    steps:
      - id: pick
        env:
          CHOICE: ${{ inputs.edition || 'all' }}
        run: |
          if [[ "$CHOICE" == "all" ]]; then
            echo 'editions=["bayzite-gnome","bayzite-gnome-nvidia","bayzite-kde","bayzite-kde-nvidia"]' >> "$GITHUB_OUTPUT"
          else
            echo "editions=[\"$CHOICE\"]" >> "$GITHUB_OUTPUT"
          fi

  iso:
    name: ISO ${{ matrix.edition }}
    needs: plan
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(needs.plan.outputs.editions) }}

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare installer config
        run: |
          set -euxo pipefail
          REGISTRY="${IMAGE_REGISTRY,,}"
          IMAGE_REF="${REGISTRY}/${{ matrix.edition }}:latest"
          {
            echo "IMAGE_REF=${IMAGE_REF}"
            echo "USER_UID=$(id -u)"
            echo "USER_GID=$(id -g)"
          } >> "$GITHUB_ENV"
          sed "s|__IMAGE_REF__|${IMAGE_REF}|g" disk_config/iso.toml > disk_config/iso-rendered.toml
          cat disk_config/iso-rendered.toml

      # Lets the builder pull your image even while the package is still private.
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GH_TOKEN}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build ISO
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./disk_config/iso-rendered.toml
          image: ${{ env.IMAGE_REF }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: anaconda-iso
          rootfs: btrfs
          additional-args: --use-librepo=True

      - name: Name the ISO and add a checksum
        id: name
        run: |
          set -euxo pipefail
          OUT="${{ steps.build.outputs.output-directory }}"
          ISO="$(find "$OUT" -name '*.iso' | head -n1)"
          test -n "$ISO"
          FINAL="$OUT/${{ matrix.edition }}-$(date -u +%Y%m%d).iso"
          mv "$ISO" "$FINAL"
          ( cd "$OUT" && sha256sum "$(basename "$FINAL")" > "$(basename "$FINAL").sha256" )
          ls -lh "$OUT"
          echo "iso=$FINAL" >> "$GITHUB_OUTPUT"
          echo "sum=$FINAL.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.edition }}-iso
          path: |
            ${{ steps.name.outputs.iso }}
            ${{ steps.name.outputs.sum }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
